<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiccato -- Open Web Style (prototype)</title>
<link rel="stylesheet" href="https://unpkg.com/@digital-go-jp/design-tokens@2.0.1/dist/tokens.css">
<style>
  * { box-sizing: border-box; }
  html { font-family: var(--font-family-sans); }
  body { margin: 0; background: var(--color-neutral-solid-gray-50); }
  .wrap { max-width: 42rem; margin: 0 auto; padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; }
  .card { background: rgba(255, 255, 255, 0.92); border-radius: var(--border-radius-12); box-shadow: var(--elevation-1); padding: 1.25rem 1.5rem; }
  .card h1 { font-size: 1.15rem; margin: 0 0 .3rem; }
  .card p { font-size: 0.88rem; line-height: 1.5; }
  input[type="text"] { width: 100%; box-sizing: border-box; font-size: 0.95rem; border-radius: var(--border-radius-8); border: 1px solid var(--color-neutral-solid-gray-300); padding: .6rem; }
  .status { font-size: 0.85rem; color: var(--color-neutral-solid-gray-536); margin: .6rem 0; min-height: 1.2em; }
  ul.hits { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .5rem; }
  ul.hits li { border: 1px solid var(--color-neutral-solid-gray-300); border-radius: var(--border-radius-8); padding: .6rem .75rem; font-size: 0.85rem; }
  ul.hits code { background: rgba(0,0,0,0.06); padding: .1rem .3rem; border-radius: var(--border-radius-4); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
